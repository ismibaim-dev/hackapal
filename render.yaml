# Render Blueprint: one Node web service for the hackapal spike.
# Dashboard: New > Blueprint > pick this repo and the branch to deploy.
# Node comes from .node-version (22). NODE_ENV is deliberately not set to production:
# `npm ci` would then skip the devDependencies (TypeScript) that the build needs.
services:
  - type: web
    name: hackapal
    runtime: node
    region: singapore
    # Free for now (no card needed). It sleeps after ~15 min without traffic (the next
    # request waits ~1 min) and a restart wipes the in-memory order store. Before judging:
    # Supabase store, plus an uptime pinger on /health or the paid 0.5c-512mb size.
    # See docs/BUILD_LOG.md, design decision 14.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      # Secrets: Render asks for these once, when the Blueprint is created. Never commit them.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Fill in after creating the sandbox webhook that points at /webhooks/paypal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Optional override. Leave empty on Render: the app falls back to RENDER_EXTERNAL_URL,
      # which Render sets to https://<service>.onrender.com. PayPal sends buyers back here.
      - key: PUBLIC_BASE_URL
        sync: false
      # Protects the internal /api routes (money-path uses it). Render generates a
      # random value; copy it from the dashboard when you need it for a script.
      - key: API_KEY
        generateValue: true
      # Order store (Supabase project "hackapal", Singapore). The URL isn't secret.
      - key: SUPABASE_URL
        value: https://bfnxvbesrsjnfaionbcj.supabase.co
      # Secret key (sb_secret_...): bypasses RLS, server only. Set it in the Render dashboard.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional seller ping (Phase 5).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Each shop's own seller chat: shop-id=chat-id,shop-id=chat-id (find ids with npm run telegram-chats).
      - key: TELEGRAM_SHOP_CHATS
        sync: false
